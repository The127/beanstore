version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - "/"
      - "/client"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # root replaces ./client, so a shared dependency must move in both
    # modules in one pr or the root go.mod goes stale
    groups:
      shared:
        group-by: dependency-name
        patterns:
          - "*"
    # 1.84.0 is affected by GO-2026-6443
    ignore:
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
