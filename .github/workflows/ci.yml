name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: install lvm2
        run: sudo apt-get update && sudo apt-get install -y lvm2

      - name: lvm integration tests
        working-directory: lvm
        run: go test -tags integration -run TestIntegration -coverprofile=coverage-integration.out -covermode=atomic -v ./...

      - name: daemon integration tests
        run: go test -tags integration -run TestIntegration -coverprofile=coverage-integration.out -covermode=atomic -coverpkg=./internal/... -v ./internal/e2e/

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.out,./lvm/coverage-integration.out
          flags: integration

  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: lint server
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: lint client
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: client

      - name: lint lvm
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: lvm

      - name: proto lint
        uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: false
          push: false
          archive: false

      - name: proto generation check
        run: |
          buf generate
          git diff --exit-code -- client/gen

      - name: prose check
        run: |
          emdash=$(printf '\342\200\224')
          if git grep -n "$emdash" -- ':!LICENSE' ':!client/LICENSE'; then
            echo "em-dashes found, replace them (see CLAUDE.md prose rules)"
            exit 1
          fi

      - name: doc comment check
        run: bash scripts/check-doc-comments.sh

      - name: govulncheck server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: govulncheck client
        working-directory: client
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: govulncheck lvm
        working-directory: lvm
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: build and test server
        run: |
          go build ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: build and test client
        working-directory: client
        run: |
          go build ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: build and test lvm
        working-directory: lvm
        run: |
          go build ./...
          go test -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out,./client/coverage.out,./lvm/coverage.out
          flags: unit
