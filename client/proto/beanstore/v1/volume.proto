syntax = "proto3";

package beanstore.v1;

import "beanstore/v1/transfer.proto";

option go_package = "github.com/The127/beanstore/client/gen/beanstore/v1;beanstorev1";

// VolumeService is the per-node volume lifecycle API. Verbs are
// strict-state: a verb in the wrong state is refused, never absorbed.
service VolumeService {
  // CreateVolume starts creation of a thin LV. All ids are minted by the
  // orchestrator, including the operation id used to poll progress.
  rpc CreateVolume(CreateVolumeRequest) returns (CreateVolumeResponse);

  // ListVolumes reports the node's volumes and their states.
  rpc ListVolumes(ListVolumesRequest) returns (ListVolumesResponse);

  // GetNodeStatus reports the node's capacity and versions.
  rpc GetNodeStatus(GetNodeStatusRequest) returns (GetNodeStatusResponse);

  // Attach exposes a READY volume as a local block device. Refused in
  // any other state.
  rpc Attach(AttachRequest) returns (AttachResponse);

  // Detach removes an ATTACHED volume's block device. Refused in any
  // other state, and while the device is in use.
  rpc Detach(DetachRequest) returns (DetachResponse);

  // DeleteVolume removes a READY or RETIRED volume. Refused in any
  // other state.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);

  // ResizeVolume grows a READY or ATTACHED volume to the given size.
  // Shrinking is refused.
  rpc ResizeVolume(ResizeVolumeRequest) returns (ResizeVolumeResponse);

  // CreateSnapshot creates a point in time snapshot of a READY or
  // ATTACHED volume. Snapshots of snapshots are refused.
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);

  // DeleteSnapshot removes a SNAPSHOT. Volumes are removed with
  // DeleteVolume instead.
  rpc DeleteSnapshot(DeleteSnapshotRequest) returns (DeleteSnapshotResponse);

  // Export streams a snapshot's content as frames followed by a
  // trailer. Deleting the snapshot or force deleting its origin is
  // refused while the export runs.
  rpc Export(ExportRequest) returns (stream ExportResponse);

  // PrepareReceive creates an INCOMING volume for a transfer. Refused
  // beyond the node's inbound transfer limit.
  rpc PrepareReceive(PrepareReceiveRequest) returns (PrepareReceiveResponse);
}

// OperationService reports on long-running node operations. Operation
// handles are volatile: a node restart forgets them, callers rescan.
service OperationService {
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
}

// VolumeState is a volume's lifecycle state. UNSPECIFIED reports a
// volume whose persisted state is missing or unreadable.
enum VolumeState {
  VOLUME_STATE_UNSPECIFIED = 0;
  VOLUME_STATE_CREATING = 1;
  VOLUME_STATE_READY = 2;
  VOLUME_STATE_ATTACHED = 3;
  VOLUME_STATE_PUSHING = 4;
  VOLUME_STATE_INCOMING = 5;
  VOLUME_STATE_RETIRED = 6;
  VOLUME_STATE_DELETING = 7;
  VOLUME_STATE_SNAPSHOT = 8;
  // COMMITTING is a pushed volume whose commit outcome is unknown.
  // The source resolves it against the target after a restart.
  VOLUME_STATE_COMMITTING = 9;
}

message Volume {
  string volume_id = 1;
  VolumeState state = 2;
  // size_bytes is the virtual size the consumer sees.
  uint64 size_bytes = 3;
  // used_bytes is the real pool space the volume occupies.
  uint64 used_bytes = 4;
  // origin_id names a snapshot's origin volume, empty otherwise.
  string origin_id = 5;
}

message ListVolumesRequest {}

message ListVolumesResponse {
  repeated Volume volumes = 1;
}

message AttachRequest {
  string volume_id = 1;
}

message AttachResponse {
  string device_path = 1;
}

message DetachRequest {
  string volume_id = 1;
}

message DetachResponse {}

message DeleteVolumeRequest {
  string volume_id = 1;
  string operation_id = 2;
  // force also removes the volume's snapshots. Without it a volume
  // with snapshots is refused.
  bool force = 3;
}

message CreateSnapshotRequest {
  string volume_id = 1;
  string snapshot_id = 2;
}

message CreateSnapshotResponse {}

message DeleteSnapshotRequest {
  string snapshot_id = 1;
}

message DeleteSnapshotResponse {}

message DeleteVolumeResponse {}

message ResizeVolumeRequest {
  string volume_id = 1;
  uint64 size_bytes = 2;
}

message ResizeVolumeResponse {}

message ExportRequest {
  string snapshot_id = 1;
}

message ExportResponse {
  oneof content {
    Frame frame = 1;
    ExportTrailer trailer = 2;
  }
}

message PrepareReceiveRequest {
  string volume_id = 1;
  uint64 size_bytes = 2;
  string transfer_id = 3;
}

message PrepareReceiveResponse {}

message GetNodeStatusRequest {}

message GetNodeStatusResponse {
  uint64 pool_size_bytes = 1;
  uint64 pool_used_bytes = 2;
  // A full metadata lv makes the pool unusable, watch these two.
  uint64 pool_metadata_size_bytes = 3;
  uint64 pool_metadata_used_bytes = 4;
  // committed_bytes is the sum of all volume virtual sizes.
  uint64 committed_bytes = 5;
  // volume_counts is the number of volumes per state name.
  map<string, uint32> volume_counts = 6;
  string beanstore_version = 7;
  string lvm_version = 8;
}

message CreateVolumeRequest {
  string volume_id = 1;
  uint64 size_bytes = 2;
  string operation_id = 3;
}

message CreateVolumeResponse {}

message GetOperationRequest {
  string operation_id = 1;
}

message GetOperationResponse {
  oneof state {
    OperationPending pending = 1;
    OperationProgress progress = 2;
    OperationDone done = 3;
    OperationFailed failed = 4;
  }
}

message OperationPending {}

message OperationProgress {
  uint64 bytes_done = 1;
}

message OperationDone {}

message OperationFailed {
  string reason = 1;
}
